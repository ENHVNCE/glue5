[package]
name = "glue5-mods"
description = "Mods: Luau scripts running in the game's script threads, calling its natives"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
glue5-game.workspace = true
glue5-runtime.workspace = true
log.workspace = true
serde = "1"
serde_json.workspace = true
mlua = { version = "0.12", features = ["luau"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
httparse = "1"
getrandom = "0.4"
flate2 = "1"
png = "0.18"
# Mods' network requests (net.rs): rustls with ring, webpki's roots, gzip.
ureq = "3.5"
# net.socket's TLS (socket.rs): ureq's rustls, ring and roots.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = { version = "1", default-features = false }
# Mods' databases (db.rs): SQLite, built in.
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache", "hooks", "limits"] }

[build-dependencies]
anyhow.workspace = true
cc.workspace = true
flate2 = "1"
sha2.workspace = true
# The same version as glue5-studio's wasm-bindgen.
wasm-bindgen-cli-support = "=0.2.129"
serde_json.workspace = true
